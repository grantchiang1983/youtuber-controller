<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 影片同步尺寸控制器</title>
    <style>
        /* CSS 樣式設定 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #1a1a1a; 
            color: white; 
            padding: 20px; 
            margin: 0;
        }

        .control-panel {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            position: sticky;
            top: 10px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; color: #ff0000; }

        .size-controls, .url-inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .input-group { display: flex; align-items: center; gap: 8px; }

        input {
            background: #444;
            border: 1px solid #555;
            color: white;
            padding: 8px;
            border-radius: 4px;
        }

        .url-in {
            flex: 1;
            min-width: 250px;
        }

        .video-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .video-container {
            background: #000;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>YouTube 多影片同步控制面板</h2>
        
        <div class="size-controls">
            <div class="input-group">
                <label>同步寬度 (px):</label>
                <input type="number" id="globalW" value="600" oninput="syncSize()">
            </div>
            <div class="input-group">
                <label>同步高度 (px):</label>
                <input type="number" id="globalH" value="340" oninput="syncSize()">
            </div>
            <span style="font-size: 0.8em; color: #888;">(建議比例 16:9, 如 480x270 或 640x360)</span>
        </div>

        <div class="url-inputs">
            <input type="text" class="url-in" placeholder="https://www.youtube.com/watch?v=1ksmiy6EsDo" onchange="changeVid(0, this.value)">
            <input type="text" class="url-in" placeholder="https://www.youtube.com/watch?v=iCetfeKzJFs" onchange="changeVid(1, this.value)">
            <input type="text" class="url-in" placeholder="https://www.youtube.com/watch?v=_k-5U7IeK8g" onchange="changeVid(2, this.value)">
            <input type="text" class="url-in" placeholder="https://www.youtube.com/watch?v=YMRVk4EnBXk" onchange="changeVid(3, this.value)">
            <input type="text" class="url-in" placeholder="https://www.youtube.com/watch?v=VM18f-IIUTw" onchange="changeVid(4, this.value)">
            <input type="text" class="url-in" placeholder="https://www.youtube.com/watch?v=5TklUbUBZss" onchange="changeVid(5, this.value)">
        </div>
    </div>

    <div class="video-grid" id="mainGrid">
        </div>

<script>
    const grid = document.getElementById('mainGrid');
    const videoCount = 6;

    // 【修改重點 1】建立一個陣列，放入你指定的 6 個影片 ID
    const defaultIDs = [
        "1ksmiy6EsDo", // 影片 1
        "iCetfeKzJFs", // 影片 2
        "_k-5U7IeK8g", // 影片 3
        "YMRVk4EnBXk", // 影片 4
        "VM18f-IIUTw", // 影片 5
        "5TklUbUBZss"  // 影片 6
    ];

    // 1. 初始化產生影片框
    for (let i = 0; i < videoCount; i++) {
        const container = document.createElement('div');
        container.className = 'video-container';
        container.id = `box-${i}`;
        container.style.width = '600px'; 
        container.style.height = '340px';
        
        // 【修改重點 2】將原本的 defaultID 改成 defaultIDs[i]，這樣迴圈跑的時候就會依序抓取 0~5 的 ID
        container.innerHTML = `<iframe id="player-${i}" src="https://www.youtube.com/embed/${defaultIDs[i]}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        grid.appendChild(container);
    }

    // 2. 同步縮放尺寸 (維持不變)
    function syncSize() {
        const w = document.getElementById('globalW').value;
        const h = document.getElementById('globalH').value;
        for (let i = 0; i < videoCount; i++) {
            const box = document.getElementById(`box-${i}`);
            if (box) {
                box.style.width = w + 'px';
                box.style.height = h + 'px';
            }
        }
    }

    // 3. 使用 Regex 完美解析任何 YouTube 網址 (維持不變)
    function extractVideoID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        
        if (match && match[2].length === 11) {
            return match[2];
        } else {
            return (url.length === 11) ? url : null;
        }
    }

    // 4. 手動更換影片功能 (維持不變)
    function changeVid(index, url) {
        if (!url) return; 
        
        const videoId = extractVideoID(url);

        if (videoId) {
            const player = document.getElementById(`player-${index}`);
            player.src = `https://www.youtube.com/embed/${videoId}`;
        } else {
            alert("無法解析此網址，請確認貼上的是正確的 YouTube 連結！");
        }
    }
</script>
</body>
</html>
